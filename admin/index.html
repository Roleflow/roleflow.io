<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin · Roleflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth/site.css">
<link rel="stylesheet" href="/acquire/acquire.css">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="app admin-panel">
<a class="skip" href="#admin-app">Skip to admin</a>
<div class="app-shell">
  <aside class="app-side" id="app-side" hidden>
    <nav class="app-nav" aria-label="Admin">
      <a href="/admin/">Businesses</a>
      <a id="nav-applications" href="/admin/#applications" hidden>Applications Tracker</a>
    </nav>
    <nav hidden aria-hidden="true">
      <a href="/admin/hq/">Agentic HQ</a>
      <a href="/account/acquisition/">Acquisition</a>
      <a href="/businesses/">Businesses</a>
      <a href="/account/#profile">Your account</a>
    </nav>
  </aside>
  <div class="nav-backdrop" id="nav-backdrop" hidden></div>
  <div class="app-main">
    <header class="app-top admin-bar">
      <a class="brand" href="/admin/"><img alt="" src="/assets/logo.jpg" width="34" height="34">Roleflow</a>
      <div class="admin-account">
        <p class="hello" id="admin-hello">Loading…</p>
        <a href="/account/#profile">Your account</a>
        <button type="button" class="btn ghost sm" id="nav-logout" hidden>Log out</button>
      </div>
    </header>
    <main class="wrap wide" id="main">
      <div class="auth-tabs admin-tabs" id="admin-tabs" hidden role="tablist" aria-label="Admin sections">
        <button type="button" role="tab" id="tab-applications" aria-selected="false" aria-controls="admin-app">Applications Tracker</button>
      </div>
      <div id="boot-state" class="state" role="status">
        <span class="skel"></span>
        <span class="skel short"></span>
        <p>Opening businesses…</p>
      </div>
      <h1 id="admin-title" class="admin-page-title">Businesses</h1>
      <div id="admin-app"></div>
    </main>
    <footer>&copy; Roleflow. Instagram DM sales systems, paid on commission.</footer>
  </div>
</div>
<button type="button" class="assistant-fab" id="assistant-open" aria-expanded="false" aria-controls="assistant-panel" aria-label="Ask Roleflow">
  <img src="/assets/logo.jpg" alt="" width="34" height="34">
</button>
<section class="assistant-panel" id="assistant-panel" hidden aria-label="Roleflow Assistant">
  <header>
    <span class="assistant-brand"><img src="/assets/logo.jpg" alt="" width="22" height="22"><strong>Roleflow Assistant</strong></span>
    <button type="button" class="btn ghost sm" id="assistant-close">Close</button>
  </header>
  <div class="assistant-log" id="assistant-log"></div>
  <form id="assistant-form">
    <label class="sr" for="assistant-input">Ask how something works</label>
    <input id="assistant-input" name="message" type="text" maxlength="800" placeholder="How do I open a business?" autocomplete="off">
    <button class="btn sm" type="submit">Send</button>
  </form>
</section>
<div id="toasts" class="toast-stack" aria-live="polite"></div>
<script src="/supabase/config.js" defer></script>
<script src="/onboarding/config.js" defer></script>
<script src="/onboarding/form-model.js" defer></script>
<script src="/onboarding/prompt.js" defer></script>
<script type="module" src="/admin/admin.js"></script>
</body>
</html>
