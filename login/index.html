<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in · Roleflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/auth/site.css">
</head>
<body>
<a class="skip" href="#login-form">Skip to log in</a>
<nav><div class="in"><a class="brand" href="/"><img alt="" src="/assets/logo.jpg" width="34" height="34">Roleflow</a><a class="navlink" href="/signup/">Sign up</a></div></nav>
<header class="hero"><div class="wrap">
  <h1>Log <span class="g">in</span></h1>
  <p class="sub">Open your account to continue onboarding, or email yourself a sign-in link.</p>
</div></header>
<main class="wrap"><div class="panel">
  <form id="login-form" class="auth-form">
    <label>Email<input id="email" name="email" type="email" autocomplete="email" inputmode="email" required></label>
    <label>Password<input id="password" name="password" type="password" autocomplete="current-password"></label>
    <p class="err" id="form-error" role="alert"></p>
    <p class="okmsg" id="form-ok" role="status"></p>
    <button class="btn" id="login-btn" type="submit">Log in</button>
    <button class="btn ghost" id="magic-btn" type="button">Email me a sign-in link</button>
    <p class="links"><a href="/reset/">Forgot password</a><a id="signup-link" href="/signup/">Create an account</a></p>
  </form>
</div></main>
<footer>&copy; Roleflow. Instagram DM sales systems, paid on commission.</footer>
<script src="/supabase/config.js"></script>
<script type="module" src="/login/login.js"></script>
</body>
</html>
