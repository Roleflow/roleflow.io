<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tell Roleflow about your offer. This page writes the system prompt for your Instagram DM setter.">
<meta name="theme-color" content="#0A1226">
<title>Roleflow: Client onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1226;--bg2:#101A33;--line:#243155;--ink:#EEF1FA;--mute:#9AA6C6;--gold:#E8B04A;--m:#C0409A;--o:#FF8A3D;--grad:linear-gradient(120deg,#7B4DFF,#C0409A 50%,#FF8A3D);
--h:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--b:'Instrument Sans','Segoe UI',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{color-scheme:dark;scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;background:radial-gradient(900px 520px at 50% -8%,rgba(123,77,255,.28),transparent 62%),radial-gradient(700px 420px at 100% 40%,rgba(255,138,61,.09),transparent 60%),var(--bg);color:var(--ink);font:400 17px/1.55 var(--b);text-align:center}
h1,h2,h3{font-family:var(--h);line-height:1.05;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(2.5rem,8.2vw,5.6rem);font-weight:800;text-transform:uppercase;letter-spacing:-.03em}
h2{font-size:clamp(1.8rem,4.6vw,3rem);font-weight:800}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.mute{color:var(--mute)}
.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
:focus-visible{outline:2px solid var(--o);outline-offset:3px}
.skip{position:absolute;left:12px;top:-48px;background:var(--gold);color:#0A1226;padding:8px 14px;border-radius:999px;z-index:10;font-weight:600;text-decoration:none}
.skip:focus{top:calc(12px + env(safe-area-inset-top,0px))}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:900px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:0;z-index:5;background:rgba(10,18,38,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav .in{max-width:1080px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;justify-content:center}
.brand{display:flex;align-items:center;gap:10px;font:800 1.2rem var(--h);color:inherit;text-decoration:none}
.brand img{width:34px;height:34px;border-radius:50%}
.btn{display:inline-block;border:0;cursor:pointer;font:600 1.02rem var(--b);color:#fff;background:var(--grad);padding:15px 30px;border-radius:999px;transition:transform .15s,box-shadow .15s;text-decoration:none;text-align:center;line-height:1.3}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(192,64,154,.45)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{box-shadow:none;border-color:var(--o)}
.btn.sm{padding:9px 20px;font-size:.92rem}
.btn[disabled]{opacity:.35;pointer-events:none}
.hero{padding:56px 0 28px}
.hero .sub{color:var(--mute);max-width:36em;margin:26px auto 0;font-size:1.2rem}
main{text-align:left;padding-bottom:28px}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:26px;padding:34px 30px;max-width:700px;margin:0 auto}
.panel h2{font-size:clamp(1.55rem,3.4vw,2.05rem);text-align:left}
#step-title,.panel{scroll-margin-top:calc(84px + env(safe-area-inset-top,0px))}
.step-desc{color:var(--mute);margin:12px 0 0;font-size:1.02rem}
.note{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(232,176,74,.08);color:var(--ink);font-size:.95rem}
.req{color:var(--o);margin-left:3px}
.req-note{color:var(--mute);font-size:.85rem;margin:16px 0 18px}
.progress{margin-bottom:22px}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.prog i.on{background:var(--grad)}
.prog-label{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin:10px 0 0;font-size:.92rem}
.save-state{color:var(--mute);text-align:right}
.save-state.warn{color:var(--o)}
.banner{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;border:1px solid var(--gold);background:rgba(232,176,74,.1);border-radius:16px;padding:14px 16px;margin-bottom:18px}
.banner p{flex:1 1 220px}
.banner-actions{display:flex;gap:8px;flex-wrap:wrap}
.field{margin:0 0 18px}
.lbl,.sub-lbl{display:block;font-weight:600;margin:0 0 6px}
.sub-lbl{margin-top:14px;font-size:.95rem}
.help{color:var(--mute);font-size:.92rem;margin:0 0 8px}
input[type=text],input[type=email],input[type=url],textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font:400 1rem/1.45 var(--b);caret-color:var(--o)}
textarea{display:block;resize:vertical;min-height:120px}
input:focus,textarea:focus{outline:none;border-color:var(--m)}
input:-webkit-autofill,textarea:-webkit-autofill{-webkit-text-fill-color:var(--ink);caret-color:var(--o);transition:background-color 9999s ease-out}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--o);outline-offset:2px}
::placeholder{color:#7E8AAE;opacity:1}
.field.invalid input,.field.invalid textarea{border-color:var(--o)}
.err{color:var(--o);margin:8px 0 0;font-size:.95rem}
.err:empty{display:none}
fieldset{border:1px solid var(--line);border-radius:18px;padding:8px 16px 10px;margin:0 0 18px;min-inline-size:0}
legend{font:700 1.05rem var(--h);padding:0 8px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font:500 1rem var(--b);cursor:pointer}
.opt input{width:1.1rem;height:1.1rem;margin-top:3px;accent-color:var(--m);flex:none}
.opt span{display:block;flex:1}
.opt small{display:block;color:var(--mute);font-weight:400;font-size:.88rem;margin-top:2px}
.opt:hover{border-color:var(--o)}
.opt:has(input:checked){border-color:var(--m);background:rgba(192,64,154,.22)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.actions .right{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.text-btn{display:inline-block;background:none;border:0;color:var(--mute);font:600 .92rem var(--b);cursor:pointer;padding:14px 0 0;text-decoration:underline;text-underline-offset:3px}
.text-btn:hover{color:var(--ink)}
.review-block{border-top:1px solid var(--line);padding:18px 0 6px;margin-top:8px}
.review-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.review-head h3{font-size:1.25rem}
dl{margin:8px 0 0}
dt{font-weight:600;margin-top:14px}
dd{margin:4px 0 0;color:var(--mute);white-space:pre-wrap;overflow-wrap:anywhere}
dd.filled{color:var(--ink)}
dd.missing{color:var(--o)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.copy-note{min-height:1.4em;margin:10px 0 0;font-weight:600}
.copy-note.ok{color:var(--gold)}
.copy-note.bad{color:var(--o)}
.prompt{text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:18px;max-height:min(70vh,640px);overflow:auto;font:400 .95rem/1.55 var(--b);margin:18px 0 0}
.handoff{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.handoff h3{font-size:1.35rem}
footer{padding:40px 22px 60px;color:var(--mute);font-size:.9rem;border-top:1px solid var(--line);text-align:center}
footer a{color:var(--gold)}
footer p+p{margin-top:8px}
@media(max-width:760px){
  .hero{padding:36px 0 20px}
  .panel{padding:26px 18px}
  .actions{flex-direction:column-reverse;align-items:stretch}
  .actions .right{margin-left:0;flex-direction:column}
  .actions .btn,.toolbar .btn,.banner-actions .btn{width:100%}
  .toolbar,.banner-actions{flex-direction:column}
  .review-head{align-items:flex-start;flex-direction:column}
  .prog-label{flex-direction:column;align-items:flex-start}
  .save-state{text-align:left}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
