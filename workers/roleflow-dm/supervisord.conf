[supervisord]
nodaemon=true
user=root
logfile=/data/logs/supervisord.log
pidfile=/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset
user=chromium
autorestart=true
priority=10
environment=HOME="/home/chromium"

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -localhost -rfbport 5900 -nopw -forever -shared -noxdamage
user=chromium
autorestart=true
priority=20
environment=HOME="/home/chromium"

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
user=agent
autorestart=true
priority=30

[program:chromium]
command=/opt/roleflow/workers/roleflow-dm/image/chromium-launch.sh
user=chromium
autorestart=true
priority=40
environment=HOME="/home/chromium",DISPLAY=":99",PLAYWRIGHT_BROWSERS_PATH="/opt/roleflow/browsers"

[program:brain]
command=/usr/local/bin/node /opt/roleflow/workers/roleflow-dm/brain.mjs
user=agent
autorestart=true
priority=50
environment=HOME="/home/agent",ROLEFLOW_DM_BROWSER="1",PLAYWRIGHT_BROWSERS_PATH="/opt/roleflow/browsers",DISPLAY=":99"
